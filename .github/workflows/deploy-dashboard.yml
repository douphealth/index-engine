name: Deploy dashboard

# Production is a Worker with static assets (dashboard/wrangler.worker.jsonc): the Cloudflare account is at its
# 100 Pages-project cap. The same functions/ folder is compiled by `wrangler pages functions build`.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/deploy-dashboard.yml"]
  workflow_dispatch:

concurrency: deploy-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply index-engine --remote --config wrangler.worker.jsonc
      - name: Build and deploy
        run: npm run deploy
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://index-engine-dashboard.papalexios.workers.dev/api/state)
          test "$code" = "401" || { echo "expected 401 from /api/state without a session, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" https://index-engine-dashboard.papalexios.workers.dev/api/engine/state)
          test "$code" = "401" || { echo "expected 401 from /api/engine/state without the engine token, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"password":"x"}' https://index-engine-dashboard.papalexios.workers.dev/api/auth/login)
          test "$code" = "401" -o "$code" = "429" || { echo "expected 401 (or 429) for a wrong password, got $code"; exit 1; }
          curl -s https://index-engine-dashboard.papalexios.workers.dev/login | grep -q "Index Engine" || { echo "the login page did not load"; exit 1; }
          curl -s https://index-engine-dashboard.papalexios.workers.dev/login | grep -q "login.js" || { echo "the login page is missing its script"; exit 1; }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Index Engine</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/login.js" defer></script>
</head>
<body>
<div class="login">
  <form class="card stack" id="f">
    <div class="row"><img src="/favicon.svg" alt="" width="26" height="26"><h1>Index Engine</h1></div>
    <p class="muted small">Portfolio indexing dashboard. Owner access only.</p>
    <label class="stack small">Password
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
    </label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
